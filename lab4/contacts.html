<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контакты — Заявка</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="header__logo">
        <img src="images/logo.png" alt="Логотип" width="50">
        <span>Ось Абсцисс</span>
    </div>
    <nav class="nav">
        <ul class="nav__list">
            <li><a href="index.html" class="nav__link">Главная</a></li>
            <li><a href="catalog.html" class="nav__link">Каталог</a></li>
            <li><a href="about.html" class="nav__link">О нас</a></li>
            <li><a href="contacts.html" class="nav__link nav__link--active">Контакты</a></li>
        </ul>
    </nav>
</header>

<main>
    <h1>Оставить заявку</h1>
    <p>Email: <a href="mailto:2023-00952@students.ssau.ru">2023-00952@students.ssau.ru</a></p>
    <p>Телефон: +7 (999) 123-45-67</p>

    
    <form class="form" id="contact-form" novalidate>
        <div class="form__row">
            <label class="form__label" for="name">Ваше имя</label>
            <input class="form__input" type="text" id="name" name="name" placeholder="Иван">
        </div>

        <div class="form__row">
            <label class="form__label" for="email">Email</label>
            <input class="form__input" type="email" id="email" name="email" placeholder="you@example.com">
        </div>

        <div class="form__row">
            <label class="form__label" for="course">Направление</label>
            <select class="form__select" id="course" name="course">
                <option value="math">Математика</option>
                <option value="physics">Физика</option>
                <option value="cs">Информатика</option>
            </select>
        </div>

        <div class="form__row">
            <label class="form__label" for="comment">Комментарий</label>
            <textarea class="form__textarea" id="comment" name="comment" rows="3"></textarea>
        </div>

        <div class="form__row form__checkbox-row">
            <input type="checkbox" id="agree" name="agree">
            <label for="agree">Согласен на обработку персональных данных</label>
        </div>

        <div class="form__error" id="form-error"></div>

        <button type="submit" class="form__btn">Отправить заявку</button>

        <div class="form__success" id="form-success">
            Заявка отправлена! Проверьте консоль.
        </div>
    </form>
</main>

<footer class="footer">
    <p>&copy; 2026 Лаба по WEBу.</p>
</footer>

<script src="js/course.js"></script>
<script src="js/script.js"></script>
</body>
</html>
